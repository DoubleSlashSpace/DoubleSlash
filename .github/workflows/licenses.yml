name: Dependency Licenses

on:
  workflow_call:
    inputs:
      checks:
        type: string
        default: licenses
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  required:
    name: License checks required
    if: always()
    needs: [policy, notices]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every license job to pass
        env:
          POLICY: ${{ needs.policy.result }}
          NOTICES: ${{ needs.notices.result }}
        run: test "$POLICY" = success && test "$NOTICES" = success

  policy:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: rust
            features: ''
          - workspace: rust/doubleslash-client
            features: qt-ui,webengine
          - workspace: rust/doubleslash-android
            features: ''
          - workspace: rust/doubleslash-supernode-manager
            features: ''
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: '1.97.1'
      - run: cargo install cargo-deny --version 0.19.0 --locked
      - name: Check workspace license policy
        working-directory: ${{ matrix.workspace }}
        env:
          FEATURES: ${{ matrix.features }}
          CHECKS: ${{ inputs.checks || 'licenses' }}
        run: |
          args=(--locked)
          if [ -n "$FEATURES" ]; then args+=(--features "$FEATURES"); fi
          checks=()
          if [ "$CHECKS" != all ]; then checks+=(licenses); fi
          cargo deny "${args[@]}" check --config "$GITHUB_WORKSPACE/deny.toml" "${checks[@]}"

  notices:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: '1.97.1'
      - run: cargo install cargo-about --version 0.8.4 --locked
      - run: node --test scripts/licenses/*.test.mjs
      - name: Generate locked target-specific notices
        run: |
          for target in x86_64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            features=qt-ui
            if [ "$target" = x86_64-pc-windows-msvc ]; then features=qt-ui,webengine; fi
            node scripts/generate_licenses.mjs --product client --target "$target" --features "$features" --output "dist/license-audit/client-$target"
            node scripts/generate_licenses.mjs --product installer --target "$target" --output "dist/license-audit/installer-$target"
          done
          for target in x86_64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            node scripts/generate_licenses.mjs --product supernode --target "$target" --output "dist/license-audit/supernode-$target"
          done
          node scripts/generate_licenses.mjs --product android --target aarch64-linux-android --output dist/license-audit/android
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-license-audit
          path: dist/license-audit
          if-no-files-found: error
