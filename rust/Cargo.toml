[workspace]
members = [
    "doubleslash-features",
    "doubleslash-supernode",
    "doubleslash-installer",
    "doubleslash-opus",
    "doubleslash-vpx",
]
# doubleslash-client is intentionally excluded: it has its own workspace root
# (rust/doubleslash-client/Cargo.toml) so the cxx-qt patch stays isolated there
# and does not affect server-side builds.
#
# The supernode manager is its own workspace too. Listing it here matters: the
# client depends on both this workspace's crates and the manager's, and Cargo
# reuses a workspace root it has already loaded for any package beneath it, so
# without the exclusion the manager's crates would inherit from this manifest.
exclude = ["doubleslash-supernode-manager"]
resolver = "2"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# wayland-scanner 0.31.10 (crates.io) pins quick-xml ^0.39; RUSTSEC-2026-0195 needs >=0.41.
# Thin fork until Smithay ships a release with the bumped dep.
[patch.crates-io]
wayland-scanner = { path = "patches/wayland-scanner" }
