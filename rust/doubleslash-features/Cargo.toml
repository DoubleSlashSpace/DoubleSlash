[package]
name = "doubleslash-features"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Capability registry and feature module spine for the Doubleslash peer-connectivity framework."

[lib]
name = "doubleslash_features"
crate-type = ["rlib"]

[features]
# Several live devices per identity. On by default so every build a user can
# end up running (CI nightly, plain local builds, APK, supernodes) routes the
# same way: a legacy client and a device-routing client on one identity evict
# each other.
default = ["device-routing"]
device-routing = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
parking_lot = "0.12"
toml = "0.8"

# Module signing + native loader (Phase 5)
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
libloading = "0.8"

[dev-dependencies]
rand = "0.8"
